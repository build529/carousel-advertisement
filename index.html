<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Partner Pitch Deck</title>
<style>
  :root {
    --bg-dark: #1c1917;
    --bg-light: #f7f4ef;
    --card-bg: #ffffff;
    --orange: #ea580c;
    --green: #15803d;
    --text-dark: #1c1917;
    --text-muted: #666059;
    --border: #e5e0d8;
    --gray-inactive: #9ca3af;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: #12100e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    touch-action: pan-y;
  }

  .deck {
    width: 100%;
    max-width: 440px;
    position: relative;
  }

  /* Slide layout - 1 slide per page */
  .slide {
    display: none;
    background: var(--bg-light);
    border-radius: 20px;
    padding: 24px;
    box-sizing: border-box;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    flex-direction: column;
    justify-content: space-between;
    min-height: 590px;
    user-select: none;
  }

  /* Show active slide only */
  .slide.active {
    display: flex;
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0.4; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  .slide-dark {
    background: var(--bg-dark);
    color: #ffffff;
  }

  .badge {
    background: var(--orange);
    color: white;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 12px;
    text-transform: uppercase;
    width: fit-content;
  }

  .title {
    font-size: 22px;
    font-weight: 800;
    margin: 10px 0 2px 0;
    line-height: 1.25;
  }

  .title-kr {
    font-size: 13px;
    color: var(--orange);
    font-weight: 700;
    margin-bottom: 16px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 14px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 2px 0;
  }

  .card-kr {
    font-size: 11px;
    color: var(--orange);
    font-weight: 700;
    margin-bottom: 6px;
  }

  .card-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0;
    line-height: 1.35;
  }

  /* Compare Grid for Slide 4 */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .plan-card {
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
  }

  .plan-old {
    background: #e5e7eb;
    border: 1px solid #d1d5db;
    color: #4b5563;
  }

  .plan-new {
    background: #ffffff;
    border: 2px solid var(--green);
    box-shadow: 0 4px 12px rgba(21, 128, 61, 0.15);
  }

  .price-tag {
    font-size: 18px;
    font-weight: 800;
    margin: 6px 0;
  }

  /* Slide 3 Media Box - Phone Screen Vertical Layout */
  .media-box {
    width: 220px;          /* Narrower width to match mobile screen proportions */
    height: 410px;         /* Increased height to reveal much more vertical content */
    margin: 0 auto;        /* Center horizontally within the slide */
    background: #1c1917;
    border: 2px dashed var(--orange);
    border-radius: 18px;   /* Phone-like rounded corners */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #a8a29e;
    text-align: center;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  .media-box video, .media-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center; /* Focuses on the top portion of the GIF */
    border-radius: 16px;
    display: block;
  }

  /* CTA Button for Slide 5 */
  .cta-btn {
    background: var(--orange);
    color: white;
    text-align: center;
    padding: 14px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 15px;
    text-decoration: none;
    display: block;
    margin-top: 10px;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
  }

  /* Interactive Slide Footer Controls */
  .slide-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .slide-dark .slide-footer {
    border-top-color: #332e2b;
  }

  .nav-btns {
    display: flex;
    gap: 8px;
  }

  .nav-btn {
    background: #e5e0d8;
    border: none;
    color: var(--text-dark);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .slide-dark .nav-btn {
    background: #292524;
    color: #ffffff;
  }

  .nav-btn:hover:not(:disabled) {
    background: var(--orange);
    color: #ffffff;
  }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .footer-num {
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
  }
</style>
</head>
<body>

<div class="deck">

  <!-- SLIDE 1: Catchy Hero Opening -->
  <div class="slide slide-dark active" style="justify-content: space-between;">
    <div style="display: flex; flex-direction: column; justify-content: center; flex: 1; padding: 10px 0;">
      <div class="badge" style="margin-bottom: 16px;">Campus Reach</div>
      <h1 class="title" style="color:#fff; font-size: 28px; line-height: 1.3; margin: 0 0 8px 0;">Reach Students Where They Check Their Meals Everyday!</h1>
      <div class="title-kr" style="font-size: 15px; color: var(--orange); margin-bottom: 32px;">매일 식단을 확인하는 대학생 필수 길목 노출</div>

      <div class="card" style="background:#292524; border-color:#444; color:#fff; text-align: center; padding: 28px 16px; border-radius: 16px;">
        <div style="font-size: 44px; font-weight: 800; color: var(--orange); margin-bottom: 4px;">🔥 ~300</div>
